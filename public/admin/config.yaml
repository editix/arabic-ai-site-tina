backend:
  name: git-gateway
  branch: main # or whatever your default branch is

media_folder: "public/" # Where images will be stored
public_folder: "/"     # How images are referenced in code

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "src/pages/index.astro"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Description", name: "description", widget: "string" }
          - { label: "Hero Main Heading", name: "hero_title", widget: "string" }
          - { label: "Hero Subtext", name: "hero_subtext", widget: "text" }