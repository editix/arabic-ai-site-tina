backend:
  name: git-gateway
  branch: main

# It is safer to point these to a specific folder
media_folder: "public" 
public_folder: ""     

collections:
  - name: "pages"
    label: "Pages"
    files:
     - label: "Home Page"
        name: "home"
        file: "src/pages/index.astro"
        fields:
          - { label: "Page Title", name: "title", widget: "string", required: false }
          - { label: "Page Description", name: "description", widget: "string", required: false }
          
          # Hero Text Fields
          - { label: "Hero Eyebrow Text", name: "hero_eyebrow", widget: "string", required: false }
          - { label: "Hero Main Heading", name: "hero_title", widget: "string", required: false }
          - { label: "Hero Sub-description", name: "hero_subtext", widget: "markdown", required: false, hint: "Use bold for highlights" }
          
          # Hero Button Fields
          - { label: "Primary Button Text", name: "btn_primary_text", widget: "string", required: false }
          - { label: "Secondary Button Text", name: "btn_secondary_text", widget: "string", required: false }

      # Stats / Footprint List
     - label: "Company Stats"
         name: "stats"
         widget: "list"
         required: false
         fields:
          - { label: "Label", name: "label", widget: "string", required: false }
          - { label: "Value", name: "value", widget: "string", required: false }
          - { label: "Suffix", name: "suffix", widget: "string", required: false, hint: "e.g. B+ or +" }
          - { label: "Description", name: "desc", widget: "string", required: false }